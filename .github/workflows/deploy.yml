name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ github.sha }} .

      - name: Load Image into Minikube
        run: |
          minikube image load my-app:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl create deployment my-app --image=my-app:${{ github.sha }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl set image deployment/my-app my-app=my-app:${{ github.sha }}
          kubectl rollout status deployment/my-app
